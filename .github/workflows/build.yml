name: Build Cursed Mini Events
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build plugin
        run: gradle clean build --no-daemon
      - name: Verify compiled plugin classes
        run: |
          test -f build/classes/java/main/com/cursedminievents/CursedMiniEvents.class
          jar tf build/libs/*.jar | grep -q 'com/cursedminievents/CursedMiniEvents.class'
          jar tf build/libs/*.jar | grep -q 'plugin.yml'
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: Cursed-Mini-Events-1.0.6
          path: build/libs/*.jar
          if-no-files-found: error
