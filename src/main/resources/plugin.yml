name: CursedMiniEvents
version: 1.0.9
main: com.cursedminievents.CursedMiniEvents
api-version: '1.21.11'
author: CursedMiniEvents
description: Custom mini-events including Lucky Leaves and the infinite-use Apple Of Life.
commands:
  minievent:
    description: Manage the Lucky Leaves mini-event.
    usage: /minievent <droprates|luckyleaves <start [minutes]|stop|status>>

  minievents:
    description: Give Cursed Mini Events items.
    usage: /minievents give apple
    permission: cursedminievents.admin
permissions:
  cursedminievents.admin:
    description: Allows managing Cursed Mini Events and receiving the Apple Of Life.
    default: op
